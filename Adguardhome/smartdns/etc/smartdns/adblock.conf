# ============================================================
# SmartDNS 本地规则（address /域名/# 语法：返回 SOA，等价「没有这条记录」）
# 插件不会覆盖本文件；升级时若已有内容会原样保留。
# 本文件由 smartdns.conf 的 `conf-file /etc/smartdns/adblock.conf` 引入。
# ============================================================

# ---------- 私有网段反向解析（PTR）本地秒回 ----------
# 反查局域网地址时公网递归上游没有权威数据，只能等它返回 SOA/NXDOMAIN。
# 2026-11 实测（同一台设备、全新实例、交叉顺序）：
#   不带本节规则   1.0.0.10.in-addr.arpa 17-30ms、200.0.168.192.in-addr.arpa 15ms
#   带本节规则     7-15ms
# 收益只有 10-20ms，纯粹是「少一次上行往返」；写在这里是因为成本为零，
# 而且能把这类查询完全钉在本地，不受上游抖动影响。
# 注意：公网地址的反查（如 39.156.70.239 这类）不受本节影响，仍走上游。
address /10.in-addr.arpa/#
address /168.192.in-addr.arpa/#
address /254.169.in-addr.arpa/#
address /127.in-addr.arpa/#
# 172.16.0.0/12 —— 反查区是 16.172 ~ 31.172，一个区一行
address /16.172.in-addr.arpa/#
address /17.172.in-addr.arpa/#
address /18.172.in-addr.arpa/#
address /19.172.in-addr.arpa/#
address /20.172.in-addr.arpa/#
address /21.172.in-addr.arpa/#
address /22.172.in-addr.arpa/#
address /23.172.in-addr.arpa/#
address /24.172.in-addr.arpa/#
address /25.172.in-addr.arpa/#
address /26.172.in-addr.arpa/#
address /27.172.in-addr.arpa/#
address /28.172.in-addr.arpa/#
address /29.172.in-addr.arpa/#
address /30.172.in-addr.arpa/#
address /31.172.in-addr.arpa/#
# IPv6：ULA（fc00::/7）与链路本地（fe80::/10）的反查
address /d.f.ip6.arpa/#
address /8.e.f.ip6.arpa/#
address /9.e.f.ip6.arpa/#
address /a.e.f.ip6.arpa/#
address /b.e.f.ip6.arpa/#

# ---------- 自己加广告拦截（可选）----------
# 语法：address /ads.example.com/#      整域拦截
#       address /example.com/0.0.0.0  指定应答 IP
# 注意：模块默认用 AdGuard Home 的过滤器做拦截（16 万+ 规则），
#       这里只适合放少量、想立刻生效的兜底条目。