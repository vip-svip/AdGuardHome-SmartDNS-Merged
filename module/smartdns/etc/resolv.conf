# SmartDNS chroot 内的 /etc/resolv.conf
# ------------------------------------------------------------
# 注意：SmartDNS 自己不读这个文件，上游由 etc/smartdns/servers.conf 决定。
# 这里只影响 chroot 内的其他程序（例如 busybox nslookup 不带服务器参数时）。
# 早先这里列了 60 多个全球公共 DNS，容易让人误以为它是有效配置 —— 已精简为
# 实际在用的三个上游。

nameserver 223.5.5.5
nameserver 223.6.6.6
nameserver 119.29.29.29
