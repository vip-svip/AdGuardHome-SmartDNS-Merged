# SmartDNS 广告拦截（可选，默认全部注释，不影响解析）
# ------------------------------------------------------------
# 语法（改完执行 sh /data/adb/modules/AdGuardHome/scripts/sd-restart.sh）：
#   address /要拦截的域名/#          -> 返回 SOA（等同该域不存在）
#   address /example.com/0.0.0.0     -> 劫持到指定 IP
#   address /#/0.0.0.0               -> 匹配全部域名（危险，别这么写）
#
# 例：
#   address /doubleclick.net/#
#   address /googlesyndication.com/#
#   address /umeng.com/#
#
# 大规模去广告仍建议用 AdGuard Home 的过滤器列表（网页 → 过滤器），
# 本文件适合放少量手写规则，开销最低、优先级最高。
