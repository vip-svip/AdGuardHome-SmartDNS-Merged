# ============================================================
# SmartDNS 按域名分流（domain-rules）
# ------------------------------------------------------------
# 作用：让不同域名走不同上游。默认组 = servers.conf 里的明文上游（最快）；
#      加密组 enc = 127.0.0.1:6054（bin/dnsenc → DoT/DoH/DoH3/DoQ/DNSCrypt）。
#
# 本文件只写「真规则」：一行一条，# 开头为注释。
# 三种写法（示例行故意用「例：」开头，脚本不会把它当成规则）：
#   例：domain-rules /example.com/ -nameserver enc    → 该域名走加密上游
#   例：domain-rules /example.com/ -nameserver default → 该域名回到明文上游
#   例：domain-rules /example.com/ -address #          → 该域名直接回 NXDOMAIN
# 子域名自动继承：/google.com/ 同时覆盖 www.google.com / mail.google.com
#
# 改完必须重启 SmartDNS 才生效：
#   sh /data/adb/modules/AdGuardHome/scripts/sd-restart.sh
# 或在 http://127.0.0.1:6081/upstream-manage.html 点「重启 SmartDNS 生效」。
#
# 说明：加密组只有 encrypted.conf 里有可用上游时才存在（service.sh 自动维护）；
#      如果 encrypted.conf 被清空，下面的 enc 规则会被自动注释掉，不影响解析。
# ============================================================

# ---- 境外常用站点走加密上游（解析更稳，也顺带挡掉部分投毒）----
domain-rules /google.com/ -nameserver enc
domain-rules /googleapis.com/ -nameserver enc
domain-rules /gstatic.com/ -nameserver enc
domain-rules /youtube.com/ -nameserver enc
domain-rules /github.com/ -nameserver enc
domain-rules /githubusercontent.com/ -nameserver enc
domain-rules /openai.com/ -nameserver enc
domain-rules /chatgpt.com/ -nameserver enc
domain-rules /wikipedia.org/ -nameserver enc
domain-rules /telegram.org/ -nameserver enc
domain-rules /t.me/ -nameserver enc
domain-rules /discord.com/ -nameserver enc
domain-rules /reddit.com/ -nameserver enc
domain-rules /cloudflare.com/ -nameserver enc
domain-rules /npmjs.com/ -nameserver enc
domain-rules /docker.com/ -nameserver enc
domain-rules /python.org/ -nameserver enc
domain-rules /rust-lang.org/ -nameserver enc

