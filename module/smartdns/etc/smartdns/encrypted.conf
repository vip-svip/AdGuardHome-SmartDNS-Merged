# ============================================================
# SmartDNS 加密上游（DoH / DoH3 / DoT / DoQ / DNSCrypt）
# ------------------------------------------------------------
# 本模块内置的 smartdns 构建没有编译 TLS，不能直接连加密 DNS。
# 这里写的条目由 bin/dnsenc 转成本地普通 DNS（127.0.0.1:6054），
# smartdns 再把它当普通上游 —— 所以「SmartDNS 上游服务器」里
# 就能用上加密协议了。
#
# 解析链：应用 → AGH → smartdns → 127.0.0.1:6054 (dnsenc) → 加密上游
#
# 每行一条，格式   <协议> <地址>
#   doh  https://dns.alidns.com/dns-query     阿里 DoH
#   doh  https://doh.pub/dns-query            腾讯 DoH
#   dot  dns.alidns.com                       阿里 DoT（853）
#   dot  dot.pub                              腾讯 DoT
#   doh  https://dns.google/dns-query         Google DoH（境外，慢）
#   doq  dns.adguard-dns.com                  DoQ（境外）
#   h3   dns.google/dns-query                 DoH3（境外）
#   sdns sdns://AQcAAAAAAAA...                DNSCrypt stamp
# 也接受不带别名的完整 URL：https://dns.alidns.com/dns-query
#
# 增删方式（都会写回本文件）：
#   1) SmartDNS「上游服务器」页 → 刷新按钮右边「＋ 上游」→ 加密上游卡片
#   2) 浏览器打开 http://127.0.0.1:6081/upstream-manage.html
#   3) 直接编辑本文件，然后点管理页「重启 SmartDNS」
#
# 关掉全部加密上游：把下面所有非注释行删掉即可（dnsenc 会自己退出，
# smartdns 也随之只走明文 UDP 上游）。
# ============================================================

# ---- 默认启用一条：阿里 DoH（国内直连，实测约 100-130ms）----
doh https://dns.alidns.com/dns-query
