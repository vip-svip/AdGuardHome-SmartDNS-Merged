# ============================================================
# SmartDNS 明文上游清单
# ------------------------------------------------------------
# 生效写法（每行一个，改完点管理页「重启 SmartDNS」）：
#   server 223.5.5.5              普通 UDP（推荐）
#   server dns.google             域名上游（英文写法同样支持）
#   server 8.8.8.8:53             指定端口
#   server 2001:4860:4860::8888   IPv6
#   server-tcp 8.8.8.8            TCP 上游
# 注意：本模块内置的 smartdns 构建未编译 TLS，
#       server-tls / server-https 会显示「未知」。要加密请用下面的用法 4。
#
# 增删方式：
#   1) SmartDNS 页面 → 上游服务器 → 刷新按钮右边的「＋ 上游」
#   2) 浏览器打开 http://127.0.0.1:6081/upstream-manage.html
#   3) 直接编辑本文件后：sh /data/adb/modules/AdGuardHome/scripts/sd-restart.sh
#   4) 加密上游（DoT / DoH / DoH3 / DoQ / DNSCrypt）写到 encrypted.conf，
#      由 bin/dnsenc 转成 127.0.0.1:6054；再把 server 127.0.0.1:6054 加进来即可。
#      要按域名只让部分域名走加密，用 domain-rules.conf（管理页「按域名分流」卡片）。
# ============================================================

# ---- 当前生效（只放延迟最低的 3 个：23-28ms、成功率 90%+）----
# 实测：上游越多尾部越慢 —— smartdns 对 NXDOMAIN 要等所有上游答复。
#      3 个上游：网页加载中位 153ms / 最差 204ms
#      6 个上游：网页加载中位 236ms / 最差 543ms
server 223.5.5.5
server 223.6.6.6
server 119.29.29.29

