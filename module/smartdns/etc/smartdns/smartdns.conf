# ============================================================
# SmartDNS 主配置
# ============================================================
no-daemon yes
user nobody

bind 127.0.0.1:6053

# 上游只写在 servers.conf，这里引进来（网页「+ 上游服务器」改的就是它）
conf-file /etc/smartdns/servers.conf
# 本地广告拦截（address /域名/# 语法，默认全注释，自行按需添加）
conf-file /etc/smartdns/adblock.conf
# 加密上游（doh/dot 写法）由 dnsenc 转成 127.0.0.1:6054，这里引进来
# 注意：这一组带 -group enc -exclude-default-group，只被 domain-rules.conf
#       里点名走 enc 的域名使用，不参与默认解析 —— 否则每次查询都要多等一次 DoH。
conf-file /etc/smartdns/enc-servers.conf
# 按域名分流规则（/域名/ 走 enc 或 default）
conf-file /etc/smartdns/domain-rules.conf

# ---------- 测速与应答策略（实测数据决定）----------
# response-mode 对比（10 域名冷查，单位 ms，中位/最差）：
#   first-ping       240 / 711
#   tcp:443,tcp:80   504 / 1760
#   fastest-ip      1012 / 1916
#   fastest-response  74 /  99   <-- 采用，尾部延迟最低
# 结论：response-mode 是决定因素；speed-check-mode 在 fastest-response 下影响很小，
#       保留 ping（不额外开 TCP 连接，省电、少打扰 CDN 边缘节点）。
response-mode fastest-response
speed-check-mode ping
max-reply-ip-num 3

# ---------- 缓存 ----------
cache-persist yes
cache-mem-size 48m
cache-size -1
serve-expired yes
serve-expired-ttl 259200
serve-expired-reply-ttl 3
serve-expired-prefetch-time 60
prefetch-domain yes

rr-ttl-min 600
rr-ttl-max 86400
rr-ttl-reply-max 300

# ---------- IPv6 ----------
force-AAAA-SOA no
dualstack-ip-selection no

# ---------- 管理界面（6080 网页）----------
plugin /lib/smartdns_ui.so
smartdns-ui.ip http://0.0.0.0:6080
smartdns-ui.user root
smartdns-ui.password root

# 数据目录必须是持久路径！smartdns 的 UI 插件把 smartdns.db（查询日志/客户端/上游统计）
# 建在 data-dir 下；若 data-dir 落在 tmpfs（旧版的 /tmp/smartdns），开机时目录不存在→
# 建库失败→UI 的 statvfs 返回 0→is_process_suspended=true→「服务器请求处理已暂停」，
# 所有查询直接被丢弃。放到 /var/lib/smartdns（真实磁盘）后该问题不再复现。
data-dir /var/lib/smartdns
# UI 数据库保留 7 天查询日志，避免 smartdns.db 无限增长
smartdns-ui.max-query-log-age 7
